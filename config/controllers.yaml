# ros2_control for the mecanum drive in Gazebo. No namespaces, and this controller owns
# odom -> base_link because there is no EKF here.
controller_manager:
  ros__parameters:
    update_rate: 100

    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster

    mecanum_drive_controller:
      type: mecanum_drive_controller/MecanumDriveController

    arm_controller:
      type: joint_trajectory_controller/JointTrajectoryController
    gripper_controller:
      type: joint_trajectory_controller/JointTrajectoryController

mecanum_drive_controller:
  ros__parameters:
    reference_timeout: 0.5
    front_left_wheel_command_joint_name: base_front_left_wheel_joint
    front_right_wheel_command_joint_name: base_front_right_wheel_joint
    rear_left_wheel_command_joint_name: base_rear_left_wheel_joint
    rear_right_wheel_command_joint_name: base_rear_right_wheel_joint

    kinematics:
      base_frame_offset:
        x: 0.0
        y: 0.0
        theta: 0.0
      wheels_radius: 0.075
      # lx + ly with the wheels at x = 0.20 and y = 0.175, inside the contact shell
      # so a wall touches the shell first.
      sum_of_robot_center_projection_on_X_Y_axis: 0.375

    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: true
    pose_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]
    twist_covariance_diagonal: [0.001, 0.001, 0.001, 0.001, 0.001, 0.001]

arm_controller:
  ros__parameters:
    joints: [vertical_lift_joint, joint_1, joint_2, joint_3, joint_4, joint_5, joint_6]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    allow_partial_joints_goal: true

gripper_controller:
  ros__parameters:
    joints: [right_finger_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
